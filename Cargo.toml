[workspace]
resolver = "2"
members = [
    "sxr-core",
    "sxr-ledger",
    "sxr-git",
    "sxr-df",
    "sxr-verify",
    "sxr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/GodSpeedAI/RealityTrace"
homepage = "https://github.com/GodSpeedAI/RealityTrace"
readme = "README.md"
authors = ["GodSpeedAI Contributors"]
description = "RealityTrace: Cryptographic observation, evidence, and settlement runtime."

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.19.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
jsonschema = "0.18.3"
thiserror = "2.0.19"
tempfile = "3.27.0"
rusqlite = { version = "0.32.0", features = ["bundled"] }
ulid = { version = "1.1.0", features = ["serde"] }
libc = "0.2.189"

[profile.release]
lto = "thin"
