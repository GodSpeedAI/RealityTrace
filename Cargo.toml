[workspace]
resolver = "2"
members = [
    "sxr-core",
    "sxr-ledger",
    "sxr-git",
    "sxr-df",
    "sxr-verify",
    "sxr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.19.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
jsonschema = "0.18.3"
thiserror = "2.0.19"
tempfile = "3.27.0"
rusqlite = "0.32.0"
ulid = { version = "1.1.0", features = ["serde"] }
libc = "0.2.189"

[profile.release]
lto = "thin"
