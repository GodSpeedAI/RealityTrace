name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_now:
        description: 'Force publish all crates to crates.io now'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # No root (".") component is configured, so the unprefixed
    # `release_created`/`tag_name` outputs are never set; use the any-release
    # flag and the CLI crate's path-prefixed outputs instead.
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['sxr-cli--tag_name'] }}
      version: ${{ steps.release.outputs['sxr-cli--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  cargo-publish:
    name: Publish to crates.io
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_now == true
    runs-on: ubuntu-latest
    # Up to RATE_LIMIT_MAX_WAITS (3) crates.io rate-limit waits of at most
    # RATE_LIMIT_MAX_WAIT_SECONDS (660s) each, plus packaging and verification.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ./scripts/publish-crates.sh
