[package]
name = "sxr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sxr binary: manual lifecycle commands, --json output, durability reporting."

[[bin]]
name = "sxr"
path = "src/main.rs"

[dependencies]
sxr-core = { path = "../sxr-core" }
sxr-ledger = { path = "../sxr-ledger" }
sxr-git = { path = "../sxr-git" }
sxr-df = { path = "../sxr-df" }
sxr-verify = { path = "../sxr-verify" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4.6.6", features = ["derive", "env"] }
anyhow = "1.0.104"
chrono.workspace = true
rusqlite.workspace = true
ulid.workspace = true
hex.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
