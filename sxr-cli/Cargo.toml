[package]
name = "realitytrace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "The RealityTrace CLI: lifecycle commands, JSON output, and durability reporting."

[[bin]]
name = "realitytrace"
path = "src/main.rs"

[dependencies]
sxr-core = { version = "0.1.0", path = "../sxr-core" }
sxr-ledger = { version = "0.1.0", path = "../sxr-ledger" }
sxr-git = { version = "0.1.0", path = "../sxr-git" }
sxr-df = { version = "0.1.0", path = "../sxr-df" }
sxr-verify = { version = "0.1.0", path = "../sxr-verify" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4.6.6", features = ["derive", "env"] }
anyhow = "1.0.104"
chrono.workspace = true
rusqlite.workspace = true
ulid.workspace = true
hex.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
